<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#31104B" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Spine Shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="5%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="8%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="10%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  </pattern>
  <rect width="600" height="800" rx="16" fill="url(#grid)" />

  <!-- Glowing background orbs -->
  <circle cx="450" cy="200" r="140" fill="#6366F1" fill-opacity="0.25" filter="url(#glow)" />
  <circle cx="150" cy="550" r="160" fill="#A855F7" fill-opacity="0.2" filter="url(#glow)" />
  <circle cx="480" cy="650" r="120" fill="#EC4899" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Decorative AI Neural Network Node graphics -->
  <g stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="160" y1="260" x2="300" y2="200" />
    <line x1="300" y1="200" x2="440" y2="270" />
    <line x1="160" y1="260" x2="220" y2="380" />
    <line x1="300" y1="200" x2="380" y2="360" />
    <line x1="440" y1="270" x2="380" y2="360" />
    <line x1="220" y1="380" x2="380" y2="360" />
    <line x1="220" y1="380" x2="300" y2="470" />
    <line x1="380" y1="360" x2="300" y2="470" />
  </g>

  <!-- Nodes -->
  <circle cx="160" cy="260" r="6" fill="#818CF8" />
  <circle cx="300" cy="200" r="8" fill="#C084FC" />
  <circle cx="440" cy="270" r="6" fill="#F472B6" />
  <circle cx="220" cy="380" r="7" fill="#818CF8" />
  <circle cx="380" cy="360" r="9" fill="#A855F7" />
  <circle cx="300" cy="470" r="8" fill="#F43F5E" />

  <!-- Badge / Category -->
  <rect x="70" y="70" width="160" height="32" rx="16" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
  <text x="150" y="91" fill="#A5B4FC" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">DIGITAL GUIDE</text>

  <!-- Main Title -->
  <text x="70" y="160" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="34" font-weight="800" line-height="1.2">
    <tspan x="70" dy="0">Artificial Intelligence -</tspan>
    <tspan x="70" dy="44" fill="url(#accentGrad)">An brief overview</tspan>
    <tspan x="70" dy="44">for beginners</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="560" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
    <tspan x="70" dy="0">A practical, non-technical introduction</tspan>
    <tspan x="70" dy="24">to modern AI, Machine Learning &amp; LLMs.</tspan>
  </text>

  <!-- Footer Tag -->
  <rect x="70" y="680" width="460" height="1" fill="#334155" />
  <text x="70" y="715" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="2">DIGITAL CONTENTS</text>
  <text x="530" y="715" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="end">PDF EDITION</text>

  <!-- Book Spine 3D Effect / Highlight -->
  <rect width="600" height="800" rx="16" fill="url(#spineShadow)" pointer-events="none" />
  <rect width="600" height="800" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" pointer-events="none" />
</svg>
