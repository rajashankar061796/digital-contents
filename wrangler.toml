name = "digital-contents"
main = "src/worker.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Static Assets (Vite React frontend + Protected assets)
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Filename of the PDF stored inside the protected assets directory
PDF_OBJECT_KEY = "artificial-intelligence-beginners.pdf"

# Cashfree API Environment: "production" or "sandbox"
CASHFREE_ENVIRONMENT = "production"

# Cashfree API Version
CASHFREE_API_VERSION = "2023-08-01"

# Public Site Base URL
SITE_URL = "https://digital-contents.rajashankar061796.workers.dev"

# Cashfree Merchant App ID (Client ID)
CASHFREE_APP_ID = "1440612c9fd7f924a95820c280e2160441"

# ==============================================================================
# SECRETS (Kept encrypted in Cloudflare Dashboard)
# 1. CASHFREE_SECRET_KEY
# 2. CASHFREE_WEBHOOK_SECRET (optional)
# 3. DOWNLOAD_SIGNING_SECRET (optional)
# ==============================================================================
