name = "digital-contents"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 bucket binding for secure, private PDF storage
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "digital-contents-pdf"

[vars]
# Filename / Object key of the PDF stored inside the private R2 bucket
PDF_OBJECT_KEY = "artificial-intelligence-beginners.pdf"

# Cashfree API Environment: "production" or "sandbox"
CASHFREE_ENVIRONMENT = "production"

# Cashfree API Version
CASHFREE_API_VERSION = "2023-08-01"

# Public Site Base URL for Cashfree Return URL & Webhook Notifications
SITE_URL = "https://digital-contents.pages.dev"

# ==============================================================================
# SECRETS (Do NOT commit real secret values here!)
# Add these via the Cloudflare Dashboard (Pages > Settings > Environment variables)
# or via Wrangler for local development in `.dev.vars`:
# 1. CASHFREE_APP_ID
# 2. CASHFREE_SECRET_KEY
# 3. CASHFREE_WEBHOOK_SECRET (optional / defaults to CASHFREE_SECRET_KEY)
# 4. DOWNLOAD_SIGNING_SECRET (optional secret key for HMAC token signing; defaults to CASHFREE_SECRET_KEY)
# ==============================================================================
